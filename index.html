<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Motor Elétrico 3D - Ricardo Gonçalves</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06182b;font-family:Arial,sans-serif;color:#fff}#app{position:fixed;inset:0}header{position:fixed;z-index:3;left:18px;top:16px;background:rgba(3,26,48,.88);padding:12px 16px;border-left:5px solid #f58220;border-radius:8px;box-shadow:0 8px 28px #0008}h1{font-size:20px;margin:0 0 4px}header p{font-size:12px;margin:0;color:#bcd1e2}.panel{position:fixed;z-index:3;right:16px;top:16px;width:210px;padding:13px;background:rgba(3,26,48,.9);border-radius:10px;box-shadow:0 8px 28px #0008}.panel label{display:block;font-size:12px;margin:10px 0 4px}.panel button{border:0;border-radius:7px;padding:9px 11px;margin:4px 3px 0 0;font-weight:700;cursor:pointer}.main{background:#f58220;color:#fff}.alt{background:#dceaf5;color:#062b4f}input{width:100%}.tag{position:fixed;z-index:3;left:18px;bottom:18px;background:rgba(3,26,48,.85);padding:9px 13px;border-radius:8px;font-size:12px}.hint{position:fixed;z-index:3;bottom:18px;right:18px;color:#dceaf5;font-size:11px;background:rgba(3,26,48,.72);padding:8px 11px;border-radius:7px}@media(max-width:650px){header{right:12px;left:12px}.panel{top:auto;bottom:58px;left:12px;right:12px;width:auto}.hint{display:none}.tag{bottom:10px}}
</style>
</head>
<body><div id="app"></div>
<header><h1>Motor Elétrico 3D</h1><p>Realidade Aumentada | Ricardo Gonçalves</p></header>
<div class="panel"><b>Controles do motor</b><label>Velocidade do eixo</label><input id="speed" type="range" min="0" max="8" step="0.1" value="2.4"><div><button class="main" id="toggle">Pausar</button><button class="alt" id="explode">Vista explodida</button></div><button class="alt" id="reset">Reposicionar</button><button class="main" id="ar">Abrir em RA</button></div>
<div class="tag">Modelo acadêmico demonstrativo para Gestão da Manutenção 4.0</div><div class="hint">Arraste para girar • Role para aproximar</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js';
import {ARButton} from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/webxr/ARButton.js';
const host=document.getElementById('app'), scene=new THREE.Scene();scene.background=new THREE.Color(0x06182b);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);camera.position.set(4.8,3.2,6.4);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.xr.enabled=true;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.35,0);
scene.add(new THREE.HemisphereLight(0xbfe8ff,0x17202a,2.3));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(5,7,4);key.castShadow=true;scene.add(key);const rim=new THREE.PointLight(0xf58220,35,18);rim.position.set(-4,2,-3);scene.add(rim);
const motor=new THREE.Group();scene.add(motor);const blue=new THREE.MeshStandardMaterial({color:0x145f8f,metalness:.72,roughness:.28});const dark=new THREE.MeshStandardMaterial({color:0x202b33,metalness:.8,roughness:.25});const copper=new THREE.MeshStandardMaterial({color:0xc66a2b,metalness:.75,roughness:.25});const silver=new THREE.MeshStandardMaterial({color:0xb9c5cc,metalness:.92,roughness:.16});
function mesh(g,m,p=[0,0,0],r=[0,0,0]){const o=new THREE.Mesh(g,m);o.position.set(...p);o.rotation.set(...r);o.castShadow=o.receiveShadow=true;motor.add(o);return o}
const body=mesh(new THREE.CylinderGeometry(1.18,1.18,2.75,64),blue,[0,.62,0],[0,0,Math.PI/2]);for(let i=-5;i<=5;i++){mesh(new THREE.TorusGeometry(1.2,.038,12,64),dark,[i*.22,.62,0],[0,Math.PI/2,0])}
const front=mesh(new THREE.CylinderGeometry(1.06,1.13,.34,64),dark,[1.52,.62,0],[0,0,Math.PI/2]);const back=mesh(new THREE.CylinderGeometry(1.06,1.13,.34,64),dark,[-1.52,.62,0],[0,0,Math.PI/2]);
const shaft=mesh(new THREE.CylinderGeometry(.18,.18,1.55,40),silver,[2.35,.62,0],[0,0,Math.PI/2]);const rotor=mesh(new THREE.CylinderGeometry(.48,.48,2.55,40),copper,[0,.62,0],[0,0,Math.PI/2]);rotor.visible=false;
const fan=mesh(new THREE.Group(),dark);fan.position.set(-1.82,.62,0);for(let i=0;i<7;i++){const blade=new THREE.Mesh(new THREE.BoxGeometry(.08,.72,.22),silver);blade.position.y=.42;blade.rotation.x=i*Math.PI*2/7;fan.add(blade)}fan.rotation.z=Math.PI/2;
mesh(new THREE.BoxGeometry(1.2,.5,.85),dark,[-.2,1.63,0]);mesh(new THREE.BoxGeometry(2.45,.18,1.5),dark,[0,-.52,0]);mesh(new THREE.BoxGeometry(.42,.42,1.65),dark,[-.75,-.76,0]);mesh(new THREE.BoxGeometry(.42,.42,1.65),dark,[.75,-.76,0]);
const floor=new THREE.Mesh(new THREE.CircleGeometry(5,80),new THREE.MeshStandardMaterial({color:0x0a3152,roughness:.72,metalness:.2}));floor.rotation.x=-Math.PI/2;floor.position.y=-1;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(10,20,0x2b6c92,0x103855);grid.position.y=-.99;scene.add(grid);
let running=true,exploded=false,velocity=2.4;document.getElementById('speed').oninput=e=>velocity=+e.target.value;document.getElementById('toggle').onclick=e=>{running=!running;e.target.textContent=running?'Pausar':'Iniciar'};document.getElementById('explode').onclick=e=>{exploded=!exploded;front.position.x=exploded?2.25:1.52;back.position.x=exploded?-2.25:-1.52;shaft.position.x=exploded?2.8:2.35;body.material.transparent=exploded;body.material.opacity=exploded?.3:1;rotor.visible=exploded;e.target.textContent=exploded?'Montar motor':'Vista explodida'};document.getElementById('reset').onclick=()=>{camera.position.set(4.8,3.2,6.4);controls.target.set(0,.35,0);controls.update()};document.getElementById('ar').onclick=()=>document.querySelector('.ar-button-hidden')?.click();
const arb=ARButton.createButton(renderer,{optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});arb.classList.add('ar-button-hidden');arb.style.display='none';document.body.appendChild(arb);
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(running){shaft.rotation.y+=velocity*dt;rotor.rotation.y+=velocity*dt;fan.rotation.x+=velocity*dt}controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
