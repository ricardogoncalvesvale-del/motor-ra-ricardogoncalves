<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motor Elétrico 3D - Ricardo Gonçalves</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#06182b;font-family:Arial;color:#fff}#app{position:fixed;inset:0}header,.panel,.tag,.hint{position:fixed;z-index:3;background:#031a30e8;border-radius:10px}header{left:18px;top:18px;padding:14px 18px;border-left:6px solid #ff821c}h1{margin:0 0 4px;font-size:26px}header p{margin:0;color:#bed1e2}.panel{right:18px;top:18px;width:290px;padding:18px}.panel h2{margin:0 0 14px}.panel label{display:block;margin:8px 0}.panel input{width:100%}.panel button{border:0;border-radius:9px;padding:12px 15px;margin:8px 4px 0 0;font-weight:700;font-size:15px;cursor:pointer}.orange{background:#ff821c;color:#fff}.light{background:#dceaf5;color:#062b4f}.tag{left:18px;bottom:18px;padding:10px 15px}.hint{right:18px;bottom:18px;padding:10px 15px}@media(max-width:650px){header{left:10px;right:10px}.panel{left:10px;right:10px;top:auto;bottom:58px;width:auto}.hint{display:none}.tag{bottom:10px;font-size:11px}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/"}}</script></head>
<body><div id="app"></div><header><h1>Motor Elétrico 3D</h1><p>Realidade Aumentada | Ricardo Gonçalves</p></header><div class="panel"><h2>Controles do motor</h2><label>Velocidade do eixo</label><input id="speed" type="range" min="0" max="8" step=".1" value="2.4"><br><button class="orange" id="toggle">Pausar</button><button class="light" id="explode">Vista explodida</button><br><button class="light" id="reset">Reposicionar</button><button class="orange" id="ar">Abrir em RA</button></div><div class="tag">Modelo acadêmico demonstrativo para Gestão da Manutenção 4.0</div><div class="hint">Arraste para girar • Role para aproximar</div>
<script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{ARButton}from'three/addons/webxr/ARButton.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06182b);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);camera.position.set(5,3.3,6.5);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.xr.enabled=true;document.querySelector('#app').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.35,0);scene.add(new THREE.HemisphereLight(0xbfe8ff,0x16202a,2.5));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(5,7,4);light.castShadow=true;scene.add(light);const orange=new THREE.PointLight(0xff821c,28,16);orange.position.set(-4,2,-3);scene.add(orange);
const motor=new THREE.Group();scene.add(motor);const blue=new THREE.MeshStandardMaterial({color:0x156895,metalness:.65,roughness:.3}),dark=new THREE.MeshStandardMaterial({color:0x202b33,metalness:.75,roughness:.24}),silver=new THREE.MeshStandardMaterial({color:0xbecbd2,metalness:.9,roughness:.15}),copper=new THREE.MeshStandardMaterial({color:0xc66b2b,metalness:.72,roughness:.24});function add(g,m,p=[0,0,0],r=[0,0,0]){const o=new THREE.Mesh(g,m);o.position.set(...p);o.rotation.set(...r);o.castShadow=o.receiveShadow=true;motor.add(o);return o}
const body=add(new THREE.CylinderGeometry(1.18,1.18,2.75,64),blue,[0,.55,0],[0,0,Math.PI/2]);for(let i=-5;i<=5;i++)add(new THREE.TorusGeometry(1.2,.035,12,64),dark,[i*.22,.55,0],[0,Math.PI/2,0]);const front=add(new THREE.CylinderGeometry(1.06,1.13,.34,64),dark,[1.52,.55,0],[0,0,Math.PI/2]),back=add(new THREE.CylinderGeometry(1.06,1.13,.34,64),dark,[-1.52,.55,0],[0,0,Math.PI/2]),shaft=add(new THREE.CylinderGeometry(.18,.18,1.55,40),silver,[2.35,.55,0],[0,0,Math.PI/2]),rotor=add(new THREE.CylinderGeometry(.48,.48,2.55,40),copper,[0,.55,0],[0,0,Math.PI/2]);rotor.visible=false;add(new THREE.BoxGeometry(1.2,.5,.85),dark,[-.2,1.58,0]);add(new THREE.BoxGeometry(2.45,.18,1.5),dark,[0,-.58,0]);add(new THREE.BoxGeometry(.42,.42,1.65),dark,[-.75,-.8,0]);add(new THREE.BoxGeometry(.42,.42,1.65),dark,[.75,-.8,0]);const fan=new THREE.Group();motor.add(fan);fan.position.set(-1.82,.55,0);for(let i=0;i<7;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(.08,.72,.22),silver);b.position.y=.42;b.rotation.x=i*Math.PI*2/7;fan.add(b)}fan.rotation.z=Math.PI/2;const floor=new THREE.Mesh(new THREE.CircleGeometry(5,80),new THREE.MeshStandardMaterial({color:0x0a3152,roughness:.72}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.04;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(10,20,0x2b6c92,0x103855);grid.position.y=-1.03;scene.add(grid);
let running=true,exploded=false,speed=2.4;document.querySelector('#speed').oninput=e=>speed=+e.target.value;document.querySelector('#toggle').onclick=e=>{running=!running;e.target.textContent=running?'Pausar':'Iniciar'};document.querySelector('#explode').onclick=e=>{exploded=!exploded;front.position.x=exploded?2.25:1.52;back.position.x=exploded?-2.25:-1.52;shaft.position.x=exploded?2.8:2.35;body.material.transparent=exploded;body.material.opacity=exploded?.3:1;rotor.visible=exploded;e.target.textContent=exploded?'Montar motor':'Vista explodida'};document.querySelector('#reset').onclick=()=>{camera.position.set(5,3.3,6.5);controls.target.set(0,.35,0)};const arButton=ARButton.createButton(renderer,{optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});arButton.style.display='none';arButton.id='real-ar';document.body.appendChild(arButton);document.querySelector('#ar').onclick=()=>arButton.click();const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(running){shaft.rotation.y+=speed*dt;rotor.rotation.y+=speed*dt;fan.rotation.x+=speed*dt}controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
